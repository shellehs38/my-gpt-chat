name: Codebase Memory
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CBM_CACHE_DIR: ${{ runner.temp }}/svoi-lyudi-cbm
      CBM_WORKERS: "2"
      CBM_MEM_BUDGET_MB: "512"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm run memory:install
      - run: npm run memory:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codebase-memory-${{ github.sha }}
          path: |
            .local/codebase-memory/reports/*.json
            .codebase-memory/graph.db.zst
            .codebase-memory/artifact.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
