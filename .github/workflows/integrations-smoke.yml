name: Optional integration tools smoke checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/integrations/**'
      - '.github/workflows/integrations-smoke.yml'

permissions:
  contents: read

concurrency:
  group: integrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tools:
    strategy:
      fail-fast: false
      matrix:
        tool: [markitdown, docling, mem0, browser-use]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install isolated tool
        run: python -m pip install --disable-pip-version-check -r "tools/integrations/python/requirements-${{ matrix.tool }}.txt"
      - name: Verify installation
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import os
          packages = {'markitdown':'markitdown','docling':'docling','mem0':'mem0ai','browser-use':'browser-use'}
          name = packages[os.environ['TOOL']]
          print(name, version(name))
          PY
      - name: MarkItDown synthetic functional test
        if: matrix.tool == 'markitdown'
        run: |
          echo 'TEST DOCUMENT artificial building materials' > /tmp/svoi-test.txt
          python tools/integrations/python/extract.py /tmp/svoi-test.txt --backend markitdown > /tmp/svoi-extracted.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/svoi-extracted.json',encoding='utf-8'))
          assert 'artificial building materials' in data['text']
          print('synthetic conversion PASS')
          PY

  playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright in isolated package
        working-directory: tools/integrations/playwright
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        working-directory: tools/integrations/playwright
        run: npx playwright install --with-deps chromium
      - name: Start isolated test server
        run: |
          npm run dev > /tmp/svoi-next-dev.log 2>&1 &
          echo $! > /tmp/svoi-next.pid
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Local Next.js failed to start (private logs omitted)' >&2
          exit 1
      - name: Browser smoke tests (read-only)
        working-directory: tools/integrations/playwright
        run: npm test
      - name: Shut down isolated server
        if: always()
        run: |
          if [ -f /tmp/svoi-next.pid ]; then kill "$(cat /tmp/svoi-next.pid)" || true; fi
