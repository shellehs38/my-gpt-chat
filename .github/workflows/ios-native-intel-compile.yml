name: Native iOS compile on Intel macOS

on:
  push:
    branches: [codex/native-ios-windows]
    paths:
      - '.github/workflows/ios-native-intel-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios-intel-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: native

env:
  FLUTTER_VERSION: 3.47.8
  APP_SOURCE_COMMIT: 42e12c9304b35525cb8022558058d55c1400cf8e
  CI: true

jobs:
  ios_unsigned:
    name: iOS device compile only (unsigned, Intel host)
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out exact reviewed application source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.APP_SOURCE_COMMIT }}
          persist-credentials: false
      - name: Verify application source commit
        working-directory: .
        run: test "$(git rev-parse HEAD)" = "$APP_SOURCE_COMMIT"
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Show native build tool versions
        run: |
          flutter --version
          xcodebuild -version
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Compile iOS device application without signing
        run: flutter build ios --release --no-codesign
      - name: Preserve unsigned app bundle permissions
        run: tar -czf build/ios/ios-unsigned-compile-only.tar.gz -C build/ios/iphoneos Runner.app
      - name: Upload unsigned compile evidence (not an installable IPA)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-unsigned-COMPILE-ONLY-${{ env.APP_SOURCE_COMMIT }}
          path: native/build/ios/ios-unsigned-compile-only.tar.gz
          if-no-files-found: error
          retention-days: 14
