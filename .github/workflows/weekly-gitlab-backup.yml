name: Weekly GitLab backup
on:
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-gitlab-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Fetch every source branch and tag
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
      - name: Back up and verify restoration
        env:
          GITLAB_BACKUP_SSH_KEY: ${{ secrets.GITLAB_BACKUP_SSH_KEY }}
        run: python3 scripts/weekly_gitlab_backup.py
